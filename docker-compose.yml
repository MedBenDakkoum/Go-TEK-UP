services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tekdb}
      POSTGRES_DB: ${DB_NAME:-TEK_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Uniquement en local (127.0.0.1) : 5433 côté PC, 5432 dans le conteneur.
      # 5433 évite le conflit si un PostgreSQL natif écoute déjà sur 5432.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-TEK_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Dans Docker, l'hôte de la base est « db » (jamais localhost) et le port interne est 5432.
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-tekdb}@db:5432/${DB_NAME:-TEK_DB}
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET dans le fichier .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-tek-up.de,tek-up.tn,campus.tn,gmail.com}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Go-TEK-UP <no-reply@go-tek-up.local>}

volumes:
  pgdata:
